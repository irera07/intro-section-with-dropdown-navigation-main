<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Epilogue:ital,wght@0,100..900;1,100..900&family=Lexend+Deca:wght@100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <title>Intro section with dropdown navigation</title>

  <link rel="stylesheet" href="intro-style.css">
</head>
<body>
  <div class="main-container">
    <div class="top-container">
      <img src="images/logo.svg" alt="Logo" class="logo">

      <div class="properties">
        <div class="dropdown">
        <a href="#" class="link dropbtn">Features</a>
        <div class="dropdown-content">
          <div class="todo feature">
            <img src="images/icon-todo.svg" alt="todo">
            <a href="#">Todo List</a> 
          </div> 
          <div class="feature calendar ">
            <img src="images/icon-calendar.svg" alt="todo">
            <a href="#">Calendar</a>
          </div>
          <div class="reminder feature">
            <img src="images/icon-reminders.svg" alt="todo">
            <a href="#">Reminders</a>
          </div>
          <div class="planning feature">
            <img src="images/icon-planning.svg" alt="todo">
            <a href="#">Planning</a>
          </div>
        </div>
      </div>
      <div class="dropdown">
        <a href="#" class="link dropbtn">Company</a>
        <div class="dropdown-content">
          <a href="#">History</a>
          <a href="#">Our Team</a>
          <a href="#">Blog</a>
        </div>
      </div>
      <a href="#" class="link">Careers</a>
      <a href="#" class="link">About</a>
      <a href="#" class="link">Login</a>
      <button class="register">Register</button>
    </div>
      
      <button class="menu-btn">
        <!-- <img src="images/icon-menu.svg" alt="Menu" class="menu-icon"> -->
      </button> 
    </div>
    <div class="middle-container">
      <div class="hero-image">
        <img src="images/image-hero-mobile.png" alt="Hero Image Mobile" class="hero-img-mobile">
      </div>
      <div class="intro">
        <h1>Make remote work</h1>
        <p class="words">Get your team in sync, no matter your location. Streamline processes, create team rituals, and watch productivity soar.</p>
        <button class="btn">Learn more</button>
        <div class="stat">
          <div class="stats">
            <img src="images/client-databiz.svg" alt="Supervisor Icon" class="icon">
          </div>
          <div class="stats">
            <img src="images/client-audiophile.svg" alt="Supervisor Icon" class="icon">
          </div>
          <div class="stats">
            <img src="images/client-meet.svg" alt="Supervisor Icon" class="icon">
          </div>
          <div class="stats">
            <img src="images/client-maker.svg" alt="Supervisor Icon" class="icon">
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
